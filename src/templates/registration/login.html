{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0 rounded-3">
        <div class="card-body p-4 p-sm-5">
          <h3 class="card-title text-center fw-bold mb-4">Entrar no OrçaFácil</h3>

          <form method="post">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
              <div class="alert alert-danger py-2" role="alert">
                {% for error in form.non_field_errors %}
                  {{ error }}
                {% endfor %}
              </div>
            {% endif %}

            <div class="mb-3">
              <label for="{{ form.username.id_for_label }}" class="form-label fw-medium">Usuário</label>
              <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" required>
            </div>

            <div class="mb-3">
              <label for="{{ form.password.id_for_label }}" class="form-label fw-medium">Senha</label>
              <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
              Entrar
            </button>
          </form>

          <hr class="my-4">

          <div class="text-center">
            <p class="text-muted mb-2">Ainda não tem uma conta?</p>
            <a href="{% url 'register' %}" class="btn btn-outline-secondary w-100 py-2">
              Criar nova conta
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
