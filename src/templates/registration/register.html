{% extends 'templates/base.html' %}  <!-- Altere para o seu template base, se houver -->

{% block content %}
<div style="max-width: 400px; margin: 40px auto;">
  <h2>Criar uma nova conta</h2>

  <form method="post">
    {% csrf_token %}
    
    {{ form.as_p }}

    <button type="submit" style="margin-top: 10px;">Cadastrar</button>
  </form>

  <p style="margin-top: 15px;">
    Já tem uma conta? <a href="{% url 'login' %}">Faça login aqui</a>.
  </p>
</div>
{% endblock %}
